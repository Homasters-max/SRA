# CI of the WARRANT repository (phase 3, task 1.1; P-9, design D-17).
#
# Job `test`, one per OS: the kernel has only ever run on Windows, and every
# path, spawn and lock decision of phase 3 must hold on Linux too. `npm test`
# runs all four test levels (ADR-0025 п. 8: unit, app, contract, e2e) on every
# PR; OpenSpec 1.13.1 is installed first because `contract` and `e2e` fail
# without it (globalSetup), they are not skipped. `timeout-minutes` stops a hung
# run instead of GitHub's 6 h default (test-levels, task 6.1, I-139).
# Job `warrant` (phase-4c, design §8, ADR-0037): the verdict of every PR — see below.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Recovery run of an impl-PR after its merge (ADR-0037 п. 4): the evidence of
  # its runs is STALE (main moved before the merge) or the artifact expired.
  # `warrant ci fetch` names this command in its hint.
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "Merge commit M of the impl-PR on the default branch"
        required: true
        type: string

# actions and pull-requests: the contract of ForgePort and `warrant ci` read
# PRs, runs and artifacts of this repository through gh (phase-4c, design §6, §8).
permissions:
  contents: read
  actions: read
  pull-requests: read

# A recovery run has its own group: it neither cancels nor is cancelled by a
# push to main or another recovery run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit || 'run' }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Full history with tags: versions.test.ts compares every component with
      # the last release tag v* (R-14) and fails in CI when there is none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec@1.13.1

      # ADR-0033 п. 10: branch prefix and commit subjects of the PR (a
      # development check — not `warrant ci`, which judges the Change by its
      # record). HEAD is GitHub's merge commit; --no-merges leaves the PR's own.
      - name: PR form (branch prefix, commit subjects)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/dev/pr-form.js "$HEAD_REF" "$BASE_REF"

      - name: Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Install warrant from the checkout
        run: npm i -g .

      - name: warrant validate (repository)
        run: warrant validate

      # `packages/cli/test/fixtures` holds schema and pack fixtures, not a
      # WARRANT project; the golden project `feature` of pack core-sdd is the
      # smallest real one, and it is validated from a copy outside the checkout.
      - name: warrant validate (fixture project)
        run: |
          fixture="$(mktemp -d)/feature"
          cp -R packs/core-sdd/golden/feature "$fixture"
          cd "$fixture"
          warrant validate

  # The verdict of a PR (phase-4c, design §8, REQ-VER-011): `warrant ci` on the
  # result of the merge. The kind of the PR and its Change come from the record
  # in the diff, not from the branch name (ADR-0034 п. 13): a spec-PR is judged
  # by its paths, an impl-PR by the checks of VERIFYING->MERGED on the merge
  # result (CI evidence with subject.tree, uploaded as the artifact
  # `evidence-<change>-<attempt>`), an archive-PR by the CI evidence it refers
  # to and the replay of `openspec archive` (R-16). It commits nothing
  # (ADR-0010 п. 1). A red job is the maintainer's signal not to merge.
  # No `needs: test`: a failing suite is itself evidence (tests-passed FAIL).
  warrant:
    name: warrant
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The PR head (or M of a recovery run) with full history: the merge below
      # needs the base branch, `warrant ci` the parents of HEAD and the base tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit || github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The job computes the merge itself (ADR-0037 п. 3): the tip of the base
      # branch at the start of the job, not of the event, so a Re-run before the
      # merge judges the current main and heals STALE `tree`. HEAD^1 — the base,
      # HEAD^2 — the PR head (subject.commit, I-97). A recovery run judges M itself.
      - name: Merge the PR into the tip of its base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git checkout --quiet --detach "origin/$BASE_REF"
          if ! git -c user.name=warrant-ci -c user.email=warrant-ci@users.noreply.github.com \
              merge --no-ff --no-edit "$HEAD_SHA"; then
            git merge --abort || true
            echo "::error::the PR head $HEAD_SHA does not merge into $BASE_REF without conflicts: update the branch"
            exit 3
          fi
          echo "merge result $(git rev-parse HEAD): base $(git rev-parse HEAD^1), head $(git rev-parse HEAD^2)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec@1.13.1

      - name: Install warrant from the checkout
        run: npm i -g .

      # The output goes outside the checkout: the checks of VERIFYING->MERGED
      # run on the working tree (structure.test.ts lists the root). The step
      # fails with the exit code of `warrant ci`; the artifact is named by it.
      - name: warrant ci
        id: ci
        run: |
          set +e
          warrant ci > "$RUNNER_TEMP/ci.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/ci.json"
          node -e '
            const fs = require("fs");
            let j = {};
            try { j = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch {}
            const d = j.data ?? {};
            const a = d.artifact ?? {};
            const out = [`change=${j.change ?? ""}`, `artifact_name=${a.name ?? ""}`, `artifact_path=${a.path ?? ""}`];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            const errors = (j.errors ?? []).map((e) => e.code).join(", ");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `warrant ci: exit ${process.argv[2]}, kind ${d.kind ?? "?"}, change ${j.change ?? "none"}` +
              (errors ? `, errors ${errors}` : "") + "\n");
          ' "$RUNNER_TEMP/ci.json" "$code"
          exit "$code"

      # The whole directory, raw/ included (junit and stdout behind
      # artifacts[].sha256); `warrant ci fetch` imports only the EVID-*.json of
      # the chosen run. The name carries the attempt: artifacts v4 are
      # immutable, and a Re-run is a new attempt of the same run. Only an
      # impl-PR (and a recovery run) has `data.artifact`.
      - name: Upload evidence
        if: always() && steps.ci.outputs.change != '' && steps.ci.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ci.outputs.artifact_name }}
          path: ${{ steps.ci.outputs.artifact_path }}/
          include-hidden-files: true
          if-no-files-found: warn
