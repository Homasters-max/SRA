# CI of the WARRANT repository (phase 3, task 1.1; P-9, design D-17).
#
# One job per OS: the kernel has only ever run on Windows, and every path,
# spawn and lock decision of phase 3 must hold on Linux too. OpenSpec is
# installed before the tests so that no `openspec`-dependent test is skipped.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec@1.13.1

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Install warrant from the checkout
        run: npm i -g .

      - name: warrant validate (repository)
        run: warrant validate

      # `packages/cli/test/fixtures` holds schema and pack fixtures, not a
      # WARRANT project; the golden project `feature` of pack core-sdd is the
      # smallest real one, and it is validated from a copy outside the checkout.
      - name: warrant validate (fixture project)
        run: |
          fixture="$(mktemp -d)/feature"
          cp -R packs/core-sdd/golden/feature "$fixture"
          cd "$fixture"
          warrant validate
